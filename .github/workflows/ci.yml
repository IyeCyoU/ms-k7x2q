name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No --with-deps: that installs optional fonts from a slow mirror and hung several runs.
      # GitHub's runners already ship Chrome, so the libraries Chromium needs are there.
      - name: Install test browser
        timeout-minutes: 4
        run: npx playwright install chromium
      - run: npm test
      - name: Check every page, button and box (desktop and phone)
        run: npm run check:app

  deploy:
    # Only main is published, and only after every test passes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (app files only, new cache version per release)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          V="money-status-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i "s/^const V='[^']*';/const V='$V';/" _site/sw.js
          grep -q "const V='$V';" _site/sw.js
          echo "Cache version: $V"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
