<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money status">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Money status</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Money status</div>
    <div class="brand-sub">From your Moneydance export</div>
    <nav id="rail-nav" aria-label="Main"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main>
    <header class="top">
      <div class="top-left">
        <div class="navbtns" role="group" aria-label="History">
          <button class="btn icon-btn" id="nav-back" hidden disabled aria-label="Back" title="Back (Alt + Left)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <button class="btn icon-btn" id="nav-fwd" hidden disabled aria-label="Forward" title="Forward (Alt + Right)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <div class="ttl"><h1 id="title">Money status</h1><p class="sub" id="subtitle"></p></div>
      </div>
      <div class="top-actions">
        <button class="btn icon-btn" id="btn-search" aria-label="Search" title="Search (Ctrl or Command + K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
        <button class="btn icon-btn" id="btn-look" aria-label="Appearance" title="Appearance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-.9-.6-1.4-.6-2.2 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8.4-9-8.4z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg></button>
        <button class="btn icon-btn" id="btn-eye" hidden aria-pressed="false" aria-label="Hide amounts" title="Hide amounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn icon-btn" id="btn-lock" hidden aria-label="Lock now" title="Lock now"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
        <button class="btn primary" id="btn-import" aria-label="Import export"><svg class="ic-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span class="lbl">Import export</span></button>
      </div>
    </header>
    <div class="pbar" id="pbar" hidden></div>
    <div class="controls" id="controls" hidden></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="dlg-head"><h2 id="modal-title"></h2><div class="dlg-right"><div class="navbtns" id="mnav" role="group" aria-label="History" hidden><button class="btn icon-btn" id="mnav-back" disabled aria-label="Back" title="Back (Alt + Left)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="btn icon-btn" id="mnav-fwd" disabled aria-label="Forward" title="Forward (Alt + Right)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><button class="btn small" id="modal-close" aria-label="Close">Close</button></div></div>
  <div class="dlg-body" id="modal-body"></div>
  <div class="dlg-actions" id="modal-actions"></div>
</dialog>
<div class="lock" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lock-h"><div class="lock-card"><div class="brand" style="color:var(--ink);padding:0">Money status</div><h2 id="lock-h">Enter your passcode</h2><p class="sub" style="margin:0">Your data is encrypted on this device.</p><input id="lock-pass" type="password" autocomplete="current-password" aria-label="Passcode"><button class="btn primary" id="lock-go">Unlock</button><p class="lock-err" id="lock-err" role="alert"></p><button class="linkbtn" id="lock-forgot">Forgot the passcode? Remove saved data</button></div></div>
<input type="file" id="file" accept=".txt,.tsv,text/plain,text/tab-separated-values" hidden>

<script src="js/01-engine.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-charts.js"></script>
<script src="js/04-pages.js"></script>
<script src="js/05-plan.js"></script>
<script src="js/06-appearance.js"></script>
<script src="js/07-extras.js"></script>
<script src="js/08-controls.js"></script>
<script src="js/09-planning.js"></script>
<script src="js/10-shell.js"></script>
<script src="js/99-sw-register.js"></script>
</body>
</html>
